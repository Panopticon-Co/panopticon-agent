name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-x64:
    name: Build and test (Windows x64, ${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out Officer
        uses: actions/checkout@v4

      - name: Check out panopticon-contracts (for response contract tests)
        uses: actions/checkout@v4
        with:
          repository: Panopticon-Co/panopticon-contracts
          ref: "62e8a7a1e42e6ff02da929842cc07ed48b80cb72"
          path: panopticon-contracts-checkout

      - name: Move panopticon-contracts to sibling path
        run: Move-Item panopticon-contracts-checkout ..\panopticon-contracts
        shell: pwsh

      - name: Set up Python for canonical fixture validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical fixture validator dependency
        run: python -m pip install jsonschema cryptography
        shell: pwsh

      - name: Check out vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (x64-windows)
        run: |
          cmake -S . -B build-officer-x64 -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        shell: pwsh

      - name: Build
        run: cmake --build build-officer-x64
        shell: pwsh

      - name: Test
        run: |
          ./build-officer-x64/officer-response-tests.exe --emit-artifact-fixture > artifact-fixture.json
          python ../panopticon-contracts/scripts/validate_artifact_producer.py artifact-fixture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-officer-x64/officer-response-tests.exe --emit-signed-artifact-fixture > signed-artifact-fixture.json
          python ../panopticon-contracts/scripts/validate_signed_artifact_producer.py signed-artifact-fixture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Test native suites
        run: ctest --test-dir build-officer-x64 --output-on-failure --timeout 120
        shell: pwsh
